name: spike-gate

# Phase 2 spike: proves a GitHub App (custom deployment protection rule) can approve an
# environment gate. No AWS access. Removed once the role-bot gates are built.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: spike-gate
    steps:
      - name: Passed the gate
        run: echo "Approved by the spike-gate protection rule at $(date -u +%FT%TZ)"
